<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datahub — Dashboard</title>

  <!-- Supabase v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f5f4fe;
      --card-bg: #ffffff;
      --text-dark: #1b1834;
      --text-muted: #5e5a7a;
      --input-border: #e6e4f2;
      --brand-orange: #f4841f;
      --brand-red: #d9381e;
      --error-bg: #fce8e6;
      --error-text: #c5221f;
      --success-bg: #e6f4ea;
      --success-text: #137333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      padding: 20px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    /* Header Nav */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border: 2px solid var(--brand-orange);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-orange);
      font-weight: 800;
      font-size: 1.1rem;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--brand-red);
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--input-border);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      color: var(--brand-red);
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Wallet Banner */
    .wallet-card {
      background: linear-gradient(135deg, #1b1834, #2a264e);
      color: #ffffff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(27, 24, 52, 0.15);
    }

    .wallet-title {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .wallet-amount {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .user-email {
      font-size: 0.8rem;
      opacity: 0.7;
      word-break: break-all;
    }

    /* Form Card */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(27, 24, 52, 0.03);
      border: 1px solid #f0eef8;
      margin-bottom: 20px;
    }

    h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    select, input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--input-border);
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      background: #ffffff;
    }

    select:focus, input:focus {
      border-color: var(--brand-orange);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #f4841f, #d9381e);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Alerts */
    .status-alert {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }

    .status-alert.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
    }

    .status-alert.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Bar -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">D</div>
        <div class="brand-name">Datahub</div>
      </div>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>

    <!-- Wallet Balance Banner -->
    <div class="wallet-card">
      <div class="wallet-title">Wallet Balance</div>
      <div class="wallet-amount" id="walletBalance">₦0.00</div>
      <div class="user-email" id="userEmail">Loading session...</div>
    </div>

    <!-- Data Purchase Form -->
    <div class="card">
      <h3>Buy Data Bundle</h3>

      <form id="dataForm">
        <!-- Network Selector -->
        <div class="form-group">
          <label for="networkSelect">Select Network</label>
          <select id="networkSelect" onchange="loadDataPlans()" required>
            <option value="">-- Choose Network --</option>
            <option value="MTN">MTN</option>
            <option value="AIRTEL">Airtel</option>
            <option value="GLO">Glo</option>
            <option value="9MOBILE">9mobile</option>
          </select>
        </div>

        <!-- Data Plan Selector -->
        <div class="form-group">
          <label for="planSelect">Data Plan</label>
          <select id="planSelect" required disabled>
            <option value="">-- Select Network First --</option>
          </select>
        </div>

        <!-- Recipient Phone Number -->
        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" placeholder="08012345678" maxlength="11" required />
        </div>

        <button type="submit" class="btn-submit" id="buyBtn">Purchase Data</button>
        <div class="status-alert" id="statusAlert"></div>
      </form>
    </div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://ykffjitfoswdgnjxlyyc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrZmZqaXRmb3N3ZGduanhseXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTIwOTIsImV4cCI6MjEwNTg4ODA5Mn0.pkfu6MEPIpE62mkHGeDAN1WgkKVxWgzRPloa4A7rlGI';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Reliable local plan data for Easy Access API mappings
    const DATA_PLANS = {
      MTN: [
        { id: "500MB", name: "500MB (SME) - 30 Days", price: 140 },
        { id: "1GB", name: "1GB (SME) - 30 Days", price: 280 },
        { id: "2GB", name: "2GB (SME) - 30 Days", price: 560 },
        { id: "3GB", name: "3GB (SME) - 30 Days", price: 840 },
        { id: "5GB", name: "5GB (SME) - 30 Days", price: 1400 },
        { id: "10GB", name: "10GB (SME) - 30 Days", price: 2800 }
      ],
      AIRTEL: [
        { id: "500MB", name: "500MB (CG) - 30 Days", price: 150 },
        { id: "1GB", name: "1GB (CG) - 30 Days", price: 290 },
        { id: "2GB", name: "2GB (CG) - 30 Days", price: 580 },
        { id: "5GB", name: "5GB (CG) - 30 Days", price: 1450 }
      ],
      GLO: [
        { id: "1GB", name: "1GB - 30 Days", price: 270 },
        { id: "2GB", name: "2GB - 30 Days", price: 540 },
        { id: "3GB", name: "3GB - 30 Days", price: 810 },
        { id: "5GB", name: "5GB - 30 Days", price: 1350 }
      ],
      "9MOBILE": [
        { id: "1GB", name: "1GB - 30 Days", price: 220 },
        { id: "2GB", name: "2GB - 30 Days", price: 440 },
        { id: "5GB", name: "5GB - 30 Days", price: 1100 }
      ]
    };

    let currentUser = null;

    // Check user authentication on page load
    async function initDashboard() {
      const { data: { session }, error } = await supabaseClient.auth.getSession();

      // IF NOT LOGGED IN -> Redirect strictly to login.html
      if (error || !session) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = session.user;
      document.getElementById('userEmail').textContent = currentUser.email;

      // Fetch user balance from Supabase table or default
      fetchWalletBalance();
    }

    async function fetchWalletBalance() {
      // Tries fetching balance from 'profiles' or 'wallets' table in Supabase
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('wallet_balance')
        .eq('id', currentUser.id)
        .single();

      if (data && data.wallet_balance !== undefined) {
        document.getElementById('walletBalance').textContent = `₦${data.wallet_balance.toLocaleString('en-NG', { minimumFractionDigits: 2 })}`;
      } else {
        document.getElementById('walletBalance').textContent = '₦0.00';
      }
    }

    // Populate Data Plans dynamically when network changes
    function loadDataPlans() {
      const network = document.getElementById('networkSelect').value;
      const planSelect = document.getElementById('planSelect');

      planSelect.innerHTML = '<option value="">-- Select Data Plan --</option>';

      if (!network || !DATA_PLANS[network]) {
        planSelect.disabled = true;
        return;
      }

      DATA_PLANS[network].forEach(plan => {
        const option = document.createElement('option');
        option.value = plan.id;
        option.textContent = `${plan.name} — ₦${plan.price}`;
        planSelect.appendChild(option);
      });

      planSelect.disabled = false;
    }

    // Handle Order Submission
    document.getElementById('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('statusAlert');
      const btn = document.getElementById('buyBtn');

      btn.disabled = true;
      btn.textContent = 'Processing...';
      alertBox.className = 'status-alert';

      const network = document.getElementById('networkSelect').value;
      const planId = document.getElementById('planSelect').value;
      const phone = document.getElementById('phoneNumber').value;

      // Simple response simulation / payload check
      setTimeout(() => {
        alertBox.className = 'status-alert error';
        alertBox.textContent = 'Insufficient wallet balance. Please fund your wallet to proceed.';
        btn.disabled = false;
        btn.textContent = 'Purchase Data';
      }, 1000);
    });

    // Explicit Logout redirecting to login.html
    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    // Run Auth check when page loads
    window.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
