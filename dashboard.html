<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dashboard — VTU Services</title>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    :root {
      --ink: #171334;
      --ink-soft: #4b4768;
      --violet-deep: #211f3d;
      --cream: #f8f7ff;
      --line: #e7e5f5;
      --flame-1: #f4841f;
      --flame-2: #c62b2b;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      padding: 20px 12px;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Balance Card */
    .balance-card {
      background: linear-gradient(135deg, var(--violet-deep), #2a275c);
      color: #fff;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(23, 19, 52, 0.15);
    }

    .balance-card small {
      color: #a5a1c9;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-card h2 {
      font-size: 2rem;
      margin: 6px 0 14px;
      font-weight: 800;
    }

    .balance-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #c1bdde;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }

    /* Tab Navigation */
    .vtu-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #fff;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .tab-btn {
      border: none;
      background: none;
      padding: 10px 4px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--flame-1), var(--flame-2));
      color: #fff;
    }

    /* Service Cards */
    .service-card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px -15px rgba(23, 19, 52, 0.08);
      display: none;
    }

    .service-card.active {
      display: block;
    }

    .service-card h3 {
      font-size: 1.1rem;
      color: var(--violet-deep);
      margin-bottom: 16px;
    }

    /* Forms & Inputs */
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      margin: 12px 0 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      font-size: 0.95rem;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--flame-1);
    }

    .btn-action {
      background: #e7e5f5;
      color: var(--violet-deep);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--flame-1), var(--flame-2));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Status Notifications */
    .status-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }

    .status-box.success {
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
      display: block;
    }

    .status-box.error {
      background: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Balance Card Header -->
  <div class="balance-card">
    <small>Wallet Balance</small>
    <h2 id="userBalance">₦0.00</h2>
    <div class="balance-meta">
      <span id="userName">Account User</span>
      <span id="userPhone">08000000000</span>
    </div>
  </div>

  <!-- Service Tabs Navigation -->
  <div class="vtu-tabs">
    <button class="tab-btn active" onclick="switchTab('data', event)">📶 Data</button>
    <button class="tab-btn" onclick="switchTab('tv', event)">📺 Cable TV</button>
    <button class="tab-btn" onclick="switchTab('power', event)">⚡ Power</button>
    <button class="tab-btn" onclick="switchTab('exam', event)">📝 Exam</button>
  </div>

  <!-- 1. DATA PURCHASE FORM -->
  <div class="service-card active" id="tab-data">
    <h3>Purchase Data Bundle</h3>
    <form id="dataForm">
      <label for="dataNetwork">Select Network</label>
      <select id="dataNetwork" required onchange="loadDataPlans()">
        <option value="">-- Select Network --</option>
        <option value="1">MTN</option>
        <option value="2">GLO</option>
        <option value="3">AIRTEL</option>
        <option value="4">9MOBILE</option>
      </select>

      <label for="dataPlan">Data Plan</label>
      <select id="dataPlan" required>
        <option value="">-- Select Network First --</option>
      </select>

      <label for="dataPhone">Phone Number</label>
      <input type="tel" id="dataPhone" placeholder="08012345678" maxlength="11" required />

      <button type="submit" class="btn-submit" id="dataBtn">Buy Data</button>
      <div class="status-box" id="dataStatus"></div>
    </form>
  </div>

  <!-- 2. CABLE TV FORM -->
  <div class="service-card" id="tab-tv">
    <h3>Pay TV Subscription</h3>
    <form id="tvForm">
      <label for="tvCompany">Service Provider</label>
      <select id="tvCompany" required>
        <option value="1">DSTV</option>
        <option value="2">GOTV</option>
        <option value="3">STARTIMES</option>
        <option value="4">SHOWMAX</option>
      </select>

      <label for="tvIuc">SmartCard / IUC Number</label>
      <input type="text" id="tvIuc" placeholder="Enter Smartcard Number" required />
      <button type="button" class="btn-action" onclick="verifyIUC()">Verify Customer</button>
      <div id="iucResult" style="font-size:0.8rem; margin-top:6px; color:var(--violet-deep); font-weight:700;"></div>

      <label for="tvPackage">Package ID</label>
      <input type="number" id="tvPackage" placeholder="e.g. 90 (DSTV Padi)" required />

      <button type="submit" class="btn-submit" id="tvBtn">Pay Cable TV</button>
      <div class="status-box" id="tvStatus"></div>
    </form>
  </div>

  <!-- 3. ELECTRICITY FORM -->
  <div class="service-card" id="tab-power">
    <h3>Pay Electricity Bill</h3>
    <form id="powerForm">
      <label for="powerCompany">Disco Provider</label>
      <select id="powerCompany" required>
        <option value="1">Eko Electricity (EKEDC)</option>
        <option value="2">Ikeja Electricity (IKEDC)</option>
        <option value="3">PortHarcourt (PHEDC)</option>
        <option value="5">Abuja (AEDC)</option>
        <option value="6">Ibadan (IBEDC)</option>
      </select>

      <label for="meterType">Meter Type</label>
      <select id="meterType" required>
        <option value="1">PREPAID</option>
        <option value="2">POSTPAID</option>
      </select>

      <label for="meterNo">Meter Number</label>
      <input type="text" id="meterNo" placeholder="Enter Meter Number" required />

      <label for="powerAmount">Amount (₦)</label>
      <input type="number" id="powerAmount" min="1000" placeholder="Minimum ₦1000" required />

      <button type="submit" class="btn-submit" id="powerBtn">Pay Electric Bill</button>
      <div class="status-box" id="powerStatus"></div>
    </form>
  </div>

  <!-- 4. EXAM PINS FORM -->
  <div class="service-card" id="tab-exam">
    <h3>Buy Exam Scratch Pins</h3>
    <form id="examForm">
      <label for="examBoard">Exam Board</label>
      <select id="examBoard" required>
        <option value="1">WAEC</option>
        <option value="2">NECO</option>
        <option value="3">NABTEB</option>
      </select>

      <label for="pinQuantity">Quantity of Pins</label>
      <select id="pinQuantity" required>
        <option value="1">1 Pin</option>
        <option value="2">2 Pins</option>
        <option value="5">5 Pins</option>
      </select>

      <button type="submit" class="btn-submit" id="examBtn">Purchase Pins</button>
      <div class="status-box" id="examStatus"></div>
    </form>
  </div>
</div>

<script>
  // Configuration
  const EASYACCESS_TOKEN = '6cd5066fc00573565ac4cea6e83c0f5c344a94cfc9dca45265330a1e2b128976';
  const API_BASE = 'https://easyaccess.com.ng/api/live/v1';

  // Data Plans Pre-populated Mapping
  const DATA_PLANS = {
    '1': [ // MTN
      { id: 45, name: '500MB (CG) - 7 Days' },
      { id: 46, name: '1GB (CG) - 30 Days' },
      { id: 47, name: '2GB (CG) - 30 Days' },
      { id: 48, name: '3GB (CG) - 30 Days' },
      { id: 50, name: '500MB (SME) - 7 Days' },
      { id: 51, name: '1GB (SME) - 7 Days' }
    ],
    '2': [ // GLO
      { id: 159, name: '500MB (CG) - 30 Days' },
      { id: 160, name: '1GB (CG) - 30 Days' },
      { id: 161, name: '2GB (CG) - 30 Days' }
    ],
    '3': [ // AIRTEL
      { id: 105, name: '500MB (CG) - 7 Days' },
      { id: 108, name: '1GB (CG) - 7 Days' },
      { id: 124, name: '2GB (CG) - 30 Days' }
    ],
    '4': [ // 9MOBILE
      { id: 168, name: '500MB (SME) - 30 Days' },
      { id: 128, name: '1GB (SME) - 30 Days' }
    ]
  };

  // Switch UI Navigation Tabs
  function switchTab(tabName, evt) {
    document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById(`tab-${tabName}`).classList.add('active');
    if (evt && evt.target) {
      evt.target.classList.add('active');
    }
  }

  // Populate Data Plans Dropdown
  function loadDataPlans() {
    const netId = document.getElementById('dataNetwork').value;
    const planSelect = document.getElementById('dataPlan');
    planSelect.innerHTML = '<option value="">-- Select Plan --</option>';

    if (DATA_PLANS[netId]) {
      DATA_PLANS[netId].forEach(plan => {
        const opt = document.createElement('option');
        opt.value = plan.id;
        opt.textContent = plan.name;
        planSelect.appendChild(opt);
      });
    }
  }

  // 1. DATA PURCHASE HANDLER
  document.getElementById('dataForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('dataBtn');
    const status = document.getElementById('dataStatus');

    btn.disabled = true;
    btn.textContent = 'Processing Data...';
    status.className = 'status-box';

    const payload = {
      network: parseInt(document.getElementById('dataNetwork').value),
      dataplan: parseInt(document.getElementById('dataPlan').value),
      mobileno: document.getElementById('dataPhone').value.trim(),
      client_reference: 'ref_' + Date.now()
    };

    try {
      const res = await fetch(`${API_BASE}/purchase-data`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = `Success! ${data.message || 'Data purchase completed.'}`;
      } else {
        throw new Error(data.message || 'Transaction failed.');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message || 'Network error connecting to provider.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Buy Data';
    }
  });

  // 2. VERIFY CABLE TV IUC
  async function verifyIUC() {
    const company = document.getElementById('tvCompany').value;
    const iucno = document.getElementById('tvIuc').value.trim();
    const resultDiv = document.getElementById('iucResult');

    if (!iucno) {
      resultDiv.textContent = 'Please enter an IUC number first.';
      return;
    }

    resultDiv.textContent = 'Verifying...';
    try {
      const res = await fetch(`${API_BASE}/verify-tv`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ company: parseInt(company), iucno: iucno })
      });
      const data = await res.json();

      if (data.code === 200) {
        resultDiv.textContent = `Customer: ${data.customer_name} (${data.current_package || 'Active'})`;
      } else {
        resultDiv.textContent = 'Verification Failed: Invalid SmartCard';
      }
    } catch (e) {
      resultDiv.textContent = 'Unable to verify IUC number.';
    }
  }

  // 3. CABLE TV PURCHASE HANDLER
  document.getElementById('tvForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('tvBtn');
    const status = document.getElementById('tvStatus');

    btn.disabled = true;
    btn.textContent = 'Processing Payment...';
    status.className = 'status-box';

    const payload = {
      company: parseInt(document.getElementById('tvCompany').value),
      package: parseInt(document.getElementById('tvPackage').value),
      iucno: document.getElementById('tvIuc').value.trim()
    };

    try {
      const res = await fetch(`${API_BASE}/pay-tv`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = 'TV Subscription Activated Successfully!';
      } else {
        throw new Error(data.message || 'Payment failed.');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Pay Cable TV';
    }
  });

  // 4. ELECTRICITY BILL HANDLER
  document.getElementById('powerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('powerBtn');
    const status = document.getElementById('powerStatus');

    btn.disabled = true;
    btn.textContent = 'Processing Electricity Payment...';
    status.className = 'status-box';

    const payload = {
      disco: parseInt(document.getElementById('powerCompany').value),
      meter_type: parseInt(document.getElementById('meterType').value),
      meter_no: document.getElementById('meterNo').value.trim(),
      amount: parseFloat(document.getElementById('powerAmount').value)
    };

    try {
      const res = await fetch(`${API_BASE}/pay-electricity`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = `Electricity Payment Successful! Token: ${data.token || 'Processed'}`;
      } else {
        throw new Error(data.message || 'Payment failed');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message || 'Error processing electricity payment';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Pay Electric Bill';
    }
  });

  // 5. EXAM PIN PURCHASE HANDLER
  document.getElementById('examForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('examBtn');
    const status = document.getElementById('examStatus');

    btn.disabled = true;
    btn.textContent = 'Purchasing Pins...';
    status.className = 'status-box';

    const payload = {
      exam: parseInt(document.getElementById('examBoard').value),
      quantity: parseInt(document.getElementById('pinQuantity').value)
    };

    try {
      const res = await fetch(`${API_BASE}/purchase-exam-pin`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = `Pin Purchased Successfully! Pin: ${data.pin || 'Check history'}`;
      } else {
        throw new Error(data.message || 'Purchase failed');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message || 'Error purchasing pin';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Purchase Pins';
    }
  });
</script>

</body>
</html>
