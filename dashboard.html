<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dashboard — VTU Portal</title>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    :root {
      --ink: #171334;
      --ink-soft: #4b4768;
      --violet-deep: #211f3d;
      --cream: #f8f7ff;
      --line: #e7e5f5;
      --flame-1: #f4841f;
      --flame-2: #c62b2b;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      padding: 20px 12px;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .hidden { display: none !important; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 12px 30px -15px rgba(23, 19, 52, 0.08);
      margin-bottom: 20px;
    }

    .balance-card {
      background: linear-gradient(135deg, var(--violet-deep), #2a275c);
      color: #fff;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(23, 19, 52, 0.15);
      position: relative;
    }

    .balance-card small {
      color: #a5a1c9;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-card h2 {
      font-size: 2rem;
      margin: 6px 0 14px;
      font-weight: 800;
    }

    .balance-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #c1bdde;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .vtu-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #fff;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .tab-btn {
      border: none;
      background: none;
      padding: 10px 4px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--flame-1), var(--flame-2));
      color: #fff;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      margin: 12px 0 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      font-size: 0.95rem;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--flame-1);
    }

    .btn-action {
      background: #e7e5f5;
      color: var(--violet-deep);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--flame-1), var(--flame-2));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }

    .status-box.success {
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
      display: block;
    }

    .status-box.error {
      background: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ================= AUTHENTICATION VIEW ================= -->
  <div id="authView" class="card">
    <h2 style="margin-bottom: 6px; color: var(--violet-deep);">Welcome Back</h2>
    <p style="font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 20px;">Log in to access your VTU portal</p>
    
    <form id="loginForm">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" placeholder="yourname@gmail.com" required />

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required />

      <button type="submit" class="btn-submit" id="loginBtn">Sign In</button>
      <div class="status-box" id="authStatus"></div>
    </form>
  </div>

  <!-- ================= DASHBOARD VIEW ================= -->
  <div id="dashboardView" class="hidden">
    
    <!-- Balance Header Card -->
    <div class="balance-card">
      <small>Wallet Balance</small>
      <h2 id="userBalance">₦0.00</h2>
      <div class="balance-meta">
        <span id="userName">User Account</span>
        <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="vtu-tabs">
      <button class="tab-btn active" onclick="switchTab('data', event)">📶 Data</button>
      <button class="tab-btn" onclick="switchTab('tv', event)">📺 Cable TV</button>
      <button class="tab-btn" onclick="switchTab('power', event)">⚡ Power</button>
      <button class="tab-btn" onclick="switchTab('exam', event)">📝 Exam</button>
    </div>

    <!-- 1. DATA PURCHASE FORM -->
    <div class="card service-card" id="tab-data">
      <h3 style="margin-bottom: 16px;">Purchase Data Bundle</h3>
      <form id="dataForm">
        <label for="dataNetwork">Select Network</label>
        <select id="dataNetwork" required onchange="loadDataPlans()">
          <option value="">-- Select Network --</option>
          <option value="1">MTN</option>
          <option value="2">GLO</option>
          <option value="3">AIRTEL</option>
          <option value="4">9MOBILE</option>
        </select>

        <label for="dataPlan">Data Plan</label>
        <select id="dataPlan" required>
          <option value="">-- Select Network First --</option>
        </select>

        <label for="dataPhone">Phone Number</label>
        <input type="tel" id="dataPhone" placeholder="08012345678" maxlength="11" required />

        <button type="submit" class="btn-submit" id="dataBtn">Buy Data</button>
        <div class="status-box" id="dataStatus"></div>
      </form>
    </div>

    <!-- 2. CABLE TV FORM -->
    <div class="card service-card hidden" id="tab-tv">
      <h3 style="margin-bottom: 16px;">Pay TV Subscription</h3>
      <form id="tvForm">
        <label for="tvCompany">Service Provider</label>
        <select id="tvCompany" required>
          <option value="1">DSTV</option>
          <option value="2">GOTV</option>
          <option value="3">STARTIMES</option>
          <option value="4">SHOWMAX</option>
        </select>

        <label for="tvIuc">SmartCard / IUC Number</label>
        <input type="text" id="tvIuc" placeholder="Enter Smartcard Number" required />
        <button type="button" class="btn-action" onclick="verifyIUC()">Verify Customer</button>
        <div id="iucResult" style="font-size:0.8rem; margin-top:6px; color:var(--violet-deep); font-weight:700;"></div>

        <label for="tvPackage">Package ID</label>
        <input type="number" id="tvPackage" placeholder="e.g. 90 (DSTV Padi)" required />

        <button type="submit" class="btn-submit" id="tvBtn">Pay Cable TV</button>
        <div class="status-box" id="tvStatus"></div>
      </form>
    </div>

    <!-- 3. ELECTRICITY FORM -->
    <div class="card service-card hidden" id="tab-power">
      <h3 style="margin-bottom: 16px;">Pay Electricity Bill</h3>
      <form id="powerForm">
        <label for="powerCompany">Disco Provider</label>
        <select id="powerCompany" required>
          <option value="1">Eko Electricity (EKEDC)</option>
          <option value="2">Ikeja Electricity (IKEDC)</option>
          <option value="3">PortHarcourt (PHEDC)</option>
          <option value="5">Abuja (AEDC)</option>
          <option value="6">Ibadan (IBEDC)</option>
        </select>

        <label for="meterType">Meter Type</label>
        <select id="meterType" required>
          <option value="1">PREPAID</option>
          <option value="2">POSTPAID</option>
        </select>

        <label for="meterNo">Meter Number</label>
        <input type="text" id="meterNo" placeholder="Enter Meter Number" required />

        <label for="powerAmount">Amount (₦)</label>
        <input type="number" id="powerAmount" min="1000" placeholder="Minimum ₦1000" required />

        <button type="submit" class="btn-submit" id="powerBtn">Pay Electric Bill</button>
        <div class="status-box" id="powerStatus"></div>
      </form>
    </div>

    <!-- 4. EXAM PINS FORM -->
    <div class="card service-card hidden" id="tab-exam">
      <h3 style="margin-bottom: 16px;">Buy Exam Scratch Pins</h3>
      <form id="examForm">
        <label for="examBoard">Exam Board</label>
        <select id="examBoard" required>
          <option value="1">WAEC</option>
          <option value="2">NECO</option>
          <option value="3">NABTEB</option>
        </select>

        <label for="pinQuantity">Quantity of Pins</label>
        <select id="pinQuantity" required>
          <option value="1">1 Pin</option>
          <option value="2">2 Pins</option>
          <option value="5">5 Pins</option>
        </select>

        <button type="submit" class="btn-submit" id="examBtn">Purchase Pins</button>
        <div class="status-box" id="examStatus"></div>
      </form>
    </div>

  </div>
</div>

<script>
  // 1. SUPABASE INITIALIZATION
  // Replace SUPABASE_URL and SUPABASE_ANON_KEY with your project keys from Supabase Dashboard -> Project Settings -> API
  const SUPABASE_URL = 'https://ykffjitfoswdgnjxlyyc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrZmZqaXRmb3N3ZGduanhseXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTIwOTIsImV4cCI6MjEwNTg4ODA5Mn0.pkfu6MEPIpE62mkHGeDAN1WgkKVxWgzRPloa4A7rlGI';
  
  // Instance named 'supabaseClient' to prevent overwriting CDN variable
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 2. EASYACCESS API CONFIGURATION
  const EASYACCESS_TOKEN = '6cd5066fc00573565ac4cea6e83c0f5c344a94cfc9dca45265330a1e2b128976';
  const API_BASE = 'https://easyaccess.com.ng/api/live/v1';

  // Data Plans mapping
  const DATA_PLANS = {
    '1': [
      { id: 45, name: '500MB (CG) - 7 Days' },
      { id: 46, name: '1GB (CG) - 30 Days' },
      { id: 47, name: '2GB (CG) - 30 Days' },
      { id: 48, name: '3GB (CG) - 30 Days' },
      { id: 50, name: '500MB (SME) - 7 Days' },
      { id: 51, name: '1GB (SME) - 7 Days' }
    ],
    '2': [
      { id: 159, name: '500MB (CG) - 30 Days' },
      { id: 160, name: '1GB (CG) - 30 Days' },
      { id: 161, name: '2GB (CG) - 30 Days' }
    ],
    '3': [
      { id: 105, name: '500MB (CG) - 7 Days' },
      { id: 108, name: '1GB (CG) - 7 Days' },
      { id: 124, name: '2GB (CG) - 30 Days' }
    ],
    '4': [
      { id: 168, name: '500MB (SME) - 30 Days' },
      { id: 128, name: '1GB (SME) - 30 Days' }
    ]
  };

  // 3. AUTHENTICATION LOGIC
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    updateUIState(session);

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      updateUIState(session);
    });
  });

  function updateUIState(session) {
    const authView = document.getElementById('authView');
    const dashboardView = document.getElementById('dashboardView');

    if (session) {
      authView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      document.getElementById('userName').textContent = session.user.email;
    } else {
      authView.classList.remove('hidden');
      dashboardView.classList.add('hidden');
    }
  }

  // Handle Login Form
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const status = document.getElementById('authStatus');
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    btn.disabled = true;
    btn.textContent = 'Authenticating...';
    status.className = 'status-box';

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      status.className = 'status-box error';
      status.textContent = error.message;
      btn.disabled = false;
      btn.textContent = 'Sign In';
    } else {
      status.className = 'status-box success';
      status.textContent = 'Login Successful!';
    }
  });

  // Handle Logout
  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  // 4. TAB SWITCHER & DYNAMIC UI
  function switchTab(tabName, evt) {
    document.querySelectorAll('.service-card').forEach(card => card.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById(`tab-${tabName}`).classList.remove('hidden');
    if (evt && evt.target) {
      evt.target.classList.add('active');
    }
  }

  function loadDataPlans() {
    const netId = document.getElementById('dataNetwork').value;
    const planSelect = document.getElementById('dataPlan');
    planSelect.innerHTML = '<option value="">-- Select Plan --</option>';

    if (DATA_PLANS[netId]) {
      DATA_PLANS[netId].forEach(plan => {
        const opt = document.createElement('option');
        opt.value = plan.id;
        opt.textContent = plan.name;
        planSelect.appendChild(opt);
      });
    }
  }

  // 5. EASYACCESS TRANSACTION HANDLERS
  // Data Purchase
  document.getElementById('dataForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('dataBtn');
    const status = document.getElementById('dataStatus');

    btn.disabled = true;
    btn.textContent = 'Processing Data...';
    status.className = 'status-box';

    const payload = {
      network: parseInt(document.getElementById('dataNetwork').value),
      dataplan: parseInt(document.getElementById('dataPlan').value),
      mobileno: document.getElementById('dataPhone').value.trim(),
      client_reference: 'ref_' + Date.now()
    };

    try {
      const res = await fetch(`${API_BASE}/purchase-data`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = `Success! ${data.message || 'Data delivered.'}`;
      } else {
        throw new Error(data.message || 'Transaction failed.');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message || 'Network error.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Buy Data';
    }
  });

  // Cable TV Verification
  async function verifyIUC() {
    const company = document.getElementById('tvCompany').value;
    const iucno = document.getElementById('tvIuc').value.trim();
    const resultDiv = document.getElementById('iucResult');

    if (!iucno) {
      resultDiv.textContent = 'Enter an IUC number first.';
      return;
    }

    resultDiv.textContent = 'Verifying...';
    try {
      const res = await fetch(`${API_BASE}/verify-tv`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ company: parseInt(company), iucno: iucno })
      });
      const data = await res.json();

      if (data.code === 200) {
        resultDiv.textContent = `Customer: ${data.customer_name} (${data.current_package || 'Active'})`;
      } else {
        resultDiv.textContent = 'Verification Failed: Invalid SmartCard';
      }
    } catch (e) {
      resultDiv.textContent = 'Unable to verify IUC number.';
    }
  }

  // Cable TV Payment
  document.getElementById('tvForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('tvBtn');
    const status = document.getElementById('tvStatus');

    btn.disabled = true;
    btn.textContent = 'Processing...';
    status.className = 'status-box';

    const payload = {
      company: parseInt(document.getElementById('tvCompany').value),
      package: parseInt(document.getElementById('tvPackage').value),
      iucno: document.getElementById('tvIuc').value.trim()
    };

    try {
      const res = await fetch(`${API_BASE}/pay-tv`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = 'TV Subscription Activated!';
      } else {
        throw new Error(data.message || 'Payment failed.');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Pay Cable TV';
    }
  });

  // Electricity Bill Payment
  document.getElementById('powerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('powerBtn');
    const status = document.getElementById('powerStatus');

    btn.disabled = true;
    btn.textContent = 'Processing Payment...';
    status.className = 'status-box';

    const payload = {
      disco: parseInt(document.getElementById('powerCompany').value),
      meter_type: parseInt(document.getElementById('meterType').value),
      meter_no: document.getElementById('meterNo').value.trim(),
      amount: parseFloat(document.getElementById('powerAmount').value)
    };

    try {
      const res = await fetch(`${API_BASE}/pay-electricity`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = `Successful! Token: ${data.token || 'Processed'}`;
      } else {
        throw new Error(data.message || 'Payment failed.');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Pay Electric Bill';
    }
  });

  // Exam Pin Purchase
  document.getElementById('examForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('examBtn');
    const status = document.getElementById('examStatus');

    btn.disabled = true;
    btn.textContent = 'Purchasing...';
    status.className = 'status-box';

    const payload = {
      exam: parseInt(document.getElementById('examBoard').value),
      quantity: parseInt(document.getElementById('pinQuantity').value)
    };

    try {
      const res = await fetch(`${API_BASE}/purchase-exam-pin`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${EASYACCESS_TOKEN}`,
          'Cache-Control': 'no-cache',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.code === 200 || data.status === 'success') {
        status.className = 'status-box success';
        status.textContent = `Pin Purchased! ${data.pin || 'Check history'}`;
      } else {
        throw new Error(data.message || 'Purchase failed.');
      }
    } catch (err) {
      status.className = 'status-box error';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Purchase Pins';
    }
  });
</script>

</body>
</html>
