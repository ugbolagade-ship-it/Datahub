<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OyoData — Full Master Admin Panel</title>
  <style>
    :root {
      --bg: #0f0d1a;
      --card-bg: #1b1834;
      --text-light: #ffffff;
      --text-muted: #a09cb0;
      --brand-orange: #f4841f;
      --brand-red: #d9381e;
      --input-border: #2e2a4a;
      --success-bg: #133a20;
      --success-text: #42c26c;
      --error-bg: #3a1313;
      --error-text: #e55353;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-light); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    .admin-container { width: 100%; max-width: 520px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--input-border); padding-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 42px; height: auto; }
    .admin-title { font-size: 1.2rem; font-weight: 800; color: var(--brand-orange); }
    .badge-admin { background: var(--brand-red); color: #fff; font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }

    .auth-box { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--input-border); margin-bottom: 20px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid var(--input-border); }
    .stat-val { font-size: 1.4rem; font-weight: 800; margin-top: 4px; color: var(--text-light); }
    .stat-lbl { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }

    .admin-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--input-border); margin-bottom: 20px; }
    .card-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 14px; color: var(--brand-orange); display: flex; align-items: center; gap: 8px; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--input-border); background: #131124; color: #fff; font-size: 0.88rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--brand-orange); }

    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--brand-orange); color: #fff; font-weight: 800; font-size: 0.88rem; cursor: pointer; }
    .btn-secondary { background: var(--brand-red); margin-top: 8px; }

    .status-alert { margin-top: 10px; padding: 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; display: none; }
    .status-alert.error { display: block; background: var(--error-bg); color: var(--error-text); }
    .status-alert.success { display: block; background: var(--success-bg); color: var(--success-text); }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="top-bar">
      <div class="brand">
        <svg viewBox="0 0 500 280" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-logo">
          <defs>
            <linearGradient id="oyoGradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFB000"/>
              <stop offset="50%" stop-color="#FF5500"/>
              <stop offset="100%" stop-color="#E03000"/>
            </linearGradient>
          </defs>
          <rect x="70" y="85" width="70" height="16" rx="8" fill="url(#oyoGradAdmin)"/>
          <rect x="40" y="115" width="80" height="16" rx="8" fill="url(#oyoGradAdmin)"/>
          <rect x="58" y="145" width="70" height="16" rx="8" fill="url(#oyoGradAdmin)"/>
          <path d="M 230 40 L 320 40 C 390 40 440 85 440 155 C 440 225 390 270 320 270 L 230 270 Z" fill="#0A1922"/>
          <path d="M 285 95 L 315 95 C 355 95 380 120 380 155 C 380 190 355 215 315 215 L 285 215 Z" fill="#FFFFFF"/>
          <circle cx="210" cy="155" r="115" fill="url(#oyoGradAdmin)"/>
          <circle cx="210" cy="155" r="70" fill="#FFFFFF"/>
          <rect x="180" y="105" width="60" height="100" rx="12" fill="url(#oyoGradAdmin)"/>
          <rect x="186" y="113" width="48" height="74" rx="4" fill="#FFFFFF"/>
          <circle cx="210" cy="196" r="4" fill="#FFFFFF"/>
          <path d="M 214 122 L 200 150 H 211 L 206 178 L 220 150 H 209 Z" fill="url(#oyoGradAdmin)"/>
        </svg>
        <div class="admin-title">OyoData Master Admin</div>
      </div>
      <span class="badge-admin">Full Control</span>
    </div>

    <!-- ADMIN LOGIN -->
    <div id="adminAuthBox" class="auth-box">
      <div class="form-group">
        <label>Enter Secret Admin Key</label>
        <input type="password" id="adminSecretKey" placeholder="Paste ADMIN_SECRET_KEY here" />
      </div>
      <button class="btn-submit" onclick="authenticateAdmin()">Unlock Master Controls</button>
      <div id="authAlert" class="status-alert"></div>
    </div>

    <!-- MAIN CONTROL CENTER -->
    <div id="adminContent" style="display: none;">
      
      <!-- Metrics -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-lbl">Live Users</div>
          <div class="stat-val" id="statUsers">...</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Reseller Accounts</div>
          <div class="stat-val" id="statResellers" style="color: var(--brand-orange);">...</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">Easy Access Balance</div>
          <div class="stat-val" id="statProviderBal" style="font-size: 1.1rem;">Fetching...</div>
        </div>
        <div class="stat-card">
          <div class="stat-lbl">System Status</div>
          <div class="stat-val" style="color: var(--success-text); font-size: 1.1rem;">ACTIVE</div>
        </div>
      </div>

      <!-- 1. USER WALLET CONTROL -->
      <div class="admin-card">
        <div class="card-title">💳 Manage User Wallet Balance</div>
        
        <div class="form-group">
          <label>Target User Email</label>
          <input type="email" id="targetEmail" placeholder="user@gmail.com" required />
        </div>

        <div class="form-group">
          <label>Action Type</label>
          <select id="actionType">
            <option value="credit">Credit User Wallet (+)</option>
            <option value="debit">Debit User Wallet (-)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Amount (₦)</label>
          <input type="number" id="adjustAmount" placeholder="e.g. 5000" min="1" required />
        </div>

        <button class="btn-submit" onclick="processWalletAdjustment()">Execute Wallet Action</button>
        <div id="walletAlert" class="status-alert"></div>
      </div>

      <!-- 2. RESELLER STATUS CONTROL -->
      <div class="admin-card">
        <div class="card-title">⭐ Upgrade / Downgrade Tiers</div>
        
        <div class="form-group">
          <label>Target User Email</label>
          <input type="email" id="tierTargetEmail" placeholder="user@gmail.com" required />
        </div>

        <div class="form-group">
          <label>Account Tier</label>
          <select id="tierStatus">
            <option value="true">Upgrade to Reseller (5% Off Active)</option>
            <option value="false">Downgrade to Standard User</option>
          </select>
        </div>

        <button class="btn-submit btn-secondary" onclick="processTierChange()">Update Account Tier</button>
        <div id="tierAlert" class="status-alert"></div>
      </div>

      <!-- 3. SYSTEM ANNOUNCEMENT BANNER -->
      <div class="admin-card">
        <div class="card-title">📢 Broadcast Dashboard Announcement</div>
        
        <div class="form-group">
          <label>Announcement Message</label>
          <textarea id="announceText" rows="3" placeholder="e.g. MTN SME Data is back online! Happy reselling."></textarea>
        </div>

        <button class="btn-submit" onclick="publishAnnouncement()">Publish Banner to All Users</button>
        <div id="announceAlert" class="status-alert"></div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const BACKEND_URL = "https://datahub-qmzg.onrender.com";
    
    const firebaseConfig = {
      apiKey: "AIzaSyDgj3g2-VwCf4oWnETazpxxPvl2vpyl3Mo",
      authDomain: "datahub-1e310.firebaseapp.com",
      projectId: "datahub-1e310",
      storageBucket: "datahub-1e310.firebasestorage.app",
      messagingSenderId: "560867367131",
      appId: "1:560867367131:web:70933fcb051cb71fe914fe"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let activeAdminKey = "";

    window.authenticateAdmin = async function() {
      const keyInput = document.getElementById('adminSecretKey').value.trim();
      const alertBox = document.getElementById('authAlert');

      if (!keyInput) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Please enter the Admin Secret Key.";
        return;
      }

      activeAdminKey = keyInput;
      window.fetchLiveStats();
    };

    window.fetchLiveStats = async function() {
      const alertBox = document.getElementById('authAlert');
      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/stats`, {
          headers: { 'x-admin-key': activeAdminKey }
        });
        const data = await res.json();

        if (data.status === 'success') {
          document.getElementById('adminAuthBox').style.display = 'none';
          document.getElementById('adminContent').style.display = 'block';

          try {
            const usersSnapshot = await getDocs(collection(db, "users"));
            let totalUsers = usersSnapshot.size;
            let resellerCount = 0;

            usersSnapshot.forEach(doc => {
              if (doc.data().isReseller === true) resellerCount++;
            });

            document.getElementById('statUsers').textContent = totalUsers || 1;
            document.getElementById('statResellers').textContent = resellerCount;
          } catch (e) {
            document.getElementById('statUsers').textContent = "Active";
            document.getElementById('statResellers').textContent = "Active";
          }

          try {
            const balRes = await fetch(`${BACKEND_URL}/api/wallet-balance`);
            const balData = await balRes.json();
            if (balData.balance) {
              document.getElementById('statProviderBal').textContent = `₦${parseFloat(balData.balance).toLocaleString('en-NG')}`;
            } else {
              document.getElementById('statProviderBal').textContent = "Connected";
            }
          } catch (e) {
            document.getElementById('statProviderBal').textContent = "Connected";
          }

        } else {
          alertBox.className = "status-alert error";
          alertBox.textContent = data.message || "Invalid Admin Key.";
        }
      } catch (err) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Network error connecting to backend.";
      }
    };

    window.processWalletAdjustment = async function() {
      const email = document.getElementById('targetEmail').value.trim();
      const action = document.getElementById('actionType').value;
      const amount = document.getElementById('adjustAmount').value;
      const alertBox = document.getElementById('walletAlert');

      if (!email || !amount) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Please complete all fields.";
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/fund-wallet`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': activeAdminKey
          },
          body: JSON.stringify({ user_email: email, action_type: action, amount: amount })
        });
        const data = await res.json();

        alertBox.className = "status-alert success";
        alertBox.textContent = data.message;
      } catch (err) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Action failed.";
      }
    };

    window.processTierChange = async function() {
      const email = document.getElementById('tierTargetEmail').value.trim();
      const isReseller = document.getElementById('tierStatus').value === 'true';
      const alertBox = document.getElementById('tierAlert');

      if (!email) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Please enter user email.";
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/toggle-reseller`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': activeAdminKey
          },
          body: JSON.stringify({ user_email: email, is_reseller: isReseller })
        });
        const data = await res.json();

        alertBox.className = "status-alert success";
        alertBox.textContent = data.message;
      } catch (err) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Tier change failed.";
      }
    };

    window.publishAnnouncement = async function() {
      const msg = document.getElementById('announceText').value.trim();
      const alertBox = document.getElementById('announceAlert');

      if (!msg) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Please enter message text.";
        return;
      }

      try {
        await setDoc(doc(db, "system", "announcement"), {
          message: msg,
          updatedAt: new Date().toISOString()
        });
        alertBox.className = "status-alert success";
        alertBox.textContent = "Announcement broadcasted live to all users!";
      } catch (err) {
        alertBox.className = "status-alert error";
        alertBox.textContent = "Failed to broadcast message.";
      }
    };
  </script>
</body>
</html>
