<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OyoData — Login</title>

  <style>
    :root {
      --bg: #f5f4fe;
      --card-bg: #ffffff;
      --text-dark: #1b1834;
      --text-muted: #5e5a7a;
      --input-border: #e6e4f2;
      --brand-orange: #f4841f;
      --brand-red: #d9381e;
      --error-bg: #fce8e6;
      --error-text: #c5221f;
      --success-bg: #e6f4ea;
      --success-text: #137333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; }
    .auth-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 24px; padding: 32px 28px; box-shadow: 0 10px 30px rgba(27, 24, 52, 0.03); border: 1px solid #f0eef8; }
    
    /* Clickable Brand Link to index.html */
    .brand-link { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 24px; cursor: pointer; }
    .brand-logo { width: 52px; height: auto; display: block; }
    .brand-name { font-size: 1.5rem; font-weight: 800; color: var(--brand-red); letter-spacing: -0.4px; }
    
    h2 { font-size: 1.55rem; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
    .subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    
    /* Label & Forgot Password Wrapper */
    .form-group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-dark); }
    .forgot-link { font-size: 0.8rem; font-weight: 700; color: var(--brand-orange); text-decoration: none; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }

    input { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--input-border); font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--brand-orange); }
    
    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 14px; background: linear-gradient(90deg, var(--brand-orange), var(--brand-red)); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .status-alert { margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; display: none; }
    .status-alert.error { display: block; background: var(--error-bg); color: var(--error-text); }
    .status-alert.success { display: block; background: var(--success-bg); color: var(--success-text); }
    
    .toggle-footer { margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .toggle-footer a { color: var(--brand-red); font-weight: 700; text-decoration: none; }

    .copyright-footer { margin-top: 28px; text-align: center; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="index.html" class="brand-link" title="Go to Home Page">
      <svg viewBox="0 0 500 280" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-logo">
        <defs>
          <linearGradient id="oyoGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB000"/>
            <stop offset="50%" stop-color="#FF5500"/>
            <stop offset="100%" stop-color="#E03000"/>
          </linearGradient>
        </defs>
        <rect x="70" y="85" width="70" height="16" rx="8" fill="url(#oyoGradLogin)"/>
        <rect x="40" y="115" width="80" height="16" rx="8" fill="url(#oyoGradLogin)"/>
        <rect x="58" y="145" width="70" height="16" rx="8" fill="url(#oyoGradLogin)"/>
        <path d="M 230 40 L 320 40 C 390 40 440 85 440 155 C 440 225 390 270 320 270 L 230 270 Z" fill="#0A1922"/>
        <path d="M 285 95 L 315 95 C 355 95 380 120 380 155 C 380 190 355 215 315 215 L 285 215 Z" fill="#FFFFFF"/>
        <circle cx="210" cy="155" r="115" fill="url(#oyoGradLogin)"/>
        <circle cx="210" cy="155" r="70" fill="#FFFFFF"/>
        <rect x="180" y="105" width="60" height="100" rx="12" fill="url(#oyoGradLogin)"/>
        <rect x="186" y="113" width="48" height="74" rx="4" fill="#FFFFFF"/>
        <circle cx="210" cy="196" r="4" fill="#FFFFFF"/>
        <path d="M 214 122 L 200 150 H 211 L 206 178 L 220 150 H 209 Z" fill="url(#oyoGradLogin)"/>
      </svg>
      <span class="brand-name">OyoData</span>
    </a>

    <h2>Welcome back</h2>
    <p class="subtitle">Log in to manage your wallet and orders.</p>

    <form id="loginForm" onsubmit="loginUser(event)">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="yourname@gmail.com" required />
      </div>

      <div class="form-group">
        <div class="form-group-header">
          <label for="loginPassword">Password</label>
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>
        </div>
        <input type="password" id="loginPassword" placeholder="••••••••••••" required />
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">Log In</button>
      <div class="status-alert" id="loginStatus"></div>
    </form>

    <div class="toggle-footer">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>

  <div class="copyright-footer">
    Copyright © OyoData 2026
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDgj3g2-VwCf4oWnETazpxxPvl2vpyl3Mo",
      authDomain: "datahub-1e310.firebaseapp.com",
      projectId: "datahub-1e310",
      storageBucket: "datahub-1e310.firebasestorage.app",
      messagingSenderId: "560867367131",
      appId: "1:560867367131:web:70933fcb051cb71fe914fe",
      measurementId: "G-08C9CELVBK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.loginUser = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const status = document.getElementById('loginStatus');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.textContent = 'Logging in...';
      status.className = 'status-alert';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        status.className = 'status-alert success';
        status.textContent = 'Login successful! Redirecting...';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      } catch (error) {
        status.className = 'status-alert error';
        status.textContent = error.message.replace('Firebase: ', '');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    };

    window.handleForgotPassword = async function(e) {
      e.preventDefault();
      const status = document.getElementById('loginStatus');
      const email = document.getElementById('loginEmail').value.trim();

      if (!email) {
        status.className = 'status-alert error';
        status.textContent = 'Please enter your email address in the box above first.';
        return;
      }

      status.className = 'status-alert';
      status.textContent = 'Sending password reset email...';

      try {
        await sendPasswordResetEmail(auth, email);
        status.className = 'status-alert success';
        status.textContent = `Password reset link sent to ${email}. Check your inbox or spam folder.`;
      } catch (error) {
        status.className = 'status-alert error';
        status.textContent = error.message.replace('Firebase: ', '');
      }
    };
  </script>
</body>
</html>
