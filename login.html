<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Log In — Datahub</title>

<!-- Primary CDN with Fallback -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (!window.supabase) {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
  }
</script>
<script src="supabase-init.js"></script>

<style>
  :root{
    --ink:#171334; --ink-soft:#4b4768; --violet-deep:#211f3d;
    --amber:#FFC107; --cream:#f8f7ff; --line:#e7e5f5;
    --flame-1:#f4841f; --flame-2:#c62b2b; --brand-red:#e0432b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,sans-serif;background:var(--cream);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 30px;
      max-width:400px;width:100%;box-shadow:0 24px 50px -30px rgba(23,19,52,.25);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;color:var(--brand-red);margin-bottom:22px;text-decoration:none;}
  h1{font-size:1.4rem;color:var(--violet-deep);margin-bottom:6px;}
  p.sub{color:var(--ink-soft);font-size:.9rem;margin-bottom:24px;}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:.95rem;}
  input:focus{outline:none;border-color:var(--flame-1);}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:12px;
      background:linear-gradient(135deg,var(--flame-1),var(--flame-2));color:#fff;font-weight:700;
      font-size:.95rem;cursor:pointer;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:14px;font-size:.85rem;padding:10px 12px;border-radius:8px;display:none;}
  .msg.error{background:#fde8e6;color:#a3251d;display:block;}
  .msg.ok{background:#e8f7ee;color:#1a7a40;display:block;}
  .foot{text-align:center;margin-top:20px;font-size:.85rem;color:var(--ink-soft);}
  .foot a{color:var(--flame-2);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="index.html">
    <svg width="30" height="30" viewBox="0 0 48 48" fill="none">
      <path d="M12 8H24C33.9411 8 40 15.1634 40 24C40 32.8366 33.9411 40 24 40H12V8Z" stroke="url(#loginDGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 18V30" stroke="url(#loginDGrad)" stroke-width="5" stroke-linecap="round"/>
      <defs>
        <linearGradient id="loginDGrad" x1="12" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#f4841f"/>
          <stop offset="1" stop-color="#c62b2b"/>
        </linearGradient>
      </defs>
    </svg>
    Datahub
  </a>
  <h1>Welcome back</h1>
  <p class="sub">Log in to manage your wallet and orders.</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required />

    <label for="password">Password</label>
    <input id="password" type="password" name="password" required />

    <button type="submit" id="submitBtn">Log In</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">New here? <a href="signup.html">Create an account</a></div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    if (!supabase) {
      msg.className = 'msg error';
      msg.textContent = 'Connection error: Unable to load authentication service. Please check your internet connection and refresh.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    const email = form.email.value.trim();
    const password = form.password.value;

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) throw error;

      msg.className = 'msg ok';
      msg.textContent = 'Welcome back! Redirecting...';
      setTimeout(() => (window.location.href = 'dashboard.html'), 700);
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err.message || 'Invalid email or password.';
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
