<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datahub — Login</title>

  <!-- Supabase v2 CDN (MUST BE IN HEAD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f6f5ff;
      --card-bg: #ffffff;
      --text-dark: #1b1834;
      --text-muted: #5e5a7a;
      --input-border: #e6e4f2;
      --brand-orange: #f4841f;
      --brand-red: #c62b2b;
      --error-bg: #fce8e6;
      --error-text: #c5221f;
      --success-bg: #e6f4ea;
      --success-text: #137333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .auth-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(27, 24, 52, 0.04);
      border: 1px solid var(--input-border);
    }

    /* Brand Header */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--brand-orange), var(--brand-red));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--brand-red);
      letter-spacing: -0.3px;
    }

    h2 {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--input-border);
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--brand-orange);
    }

    /* Primary Gradient Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--brand-orange), var(--brand-red));
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Alert Banner */
    .status-alert {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.4;
      display: none;
    }

    .status-alert.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
    }

    .status-alert.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
    }

    /* Bottom Switcher Link */
    .toggle-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .toggle-footer a {
      color: var(--brand-red);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Datahub Brand Header -->
    <div class="brand">
      <div class="brand-logo">D</div>
      <div class="brand-name">Datahub</div>
    </div>

    <!-- ================= 1. LOGIN FORM ================= -->
    <div id="loginView">
      <h2>Welcome back</h2>
      <p class="subtitle">Log in to manage your wallet and orders.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="yourname@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••••••" required />
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">Log In</button>
        <div class="status-alert" id="loginStatus"></div>
      </form>

      <div class="toggle-footer">
        New here? <a onclick="switchView('signup')">Create an account</a>
      </div>
    </div>

    <!-- ================= 2. SIGN UP FORM ================= -->
    <div id="signupView" class="hidden">
      <h2>Create an account</h2>
      <p class="subtitle">Sign up to get started with Datahub.</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="yourname@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••••••" required minlength="6" />
        </div>

        <button type="submit" class="btn-submit" id="signupBtn">Create Account</button>
        <div class="status-alert" id="signupStatus"></div>
      </form>

      <div class="toggle-footer">
        Already have an account? <a onclick="switchView('login')">Log In</a>
      </div>
    </div>
  </div>

  <script>
    // Your Configured Supabase Credentials
    const SUPABASE_URL = 'https://ykffjitfoswdgnjxlyyc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrZmZqaXRmb3N3ZGduanhseXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTIwOTIsImV4cCI6MjEwNTg4ODA5Mn0.pkfu6MEPIpE62mkHGeDAN1WgkKVxWgzRPloa4A7rlGI';

    // Initialize Client (uses 'supabaseClient' to avoid variable shadowing error)
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Toggle between Login & Signup views inside login.html
    function switchView(view) {
      const loginView = document.getElementById('loginView');
      const signupView = document.getElementById('signupView');

      if (view === 'signup') {
        loginView.classList.add('hidden');
        signupView.classList.remove('hidden');
      } else {
        signupView.classList.add('hidden');
        loginView.classList.remove('hidden');
      }
    }

    // Handle Login Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const status = document.getElementById('loginStatus');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.textContent = 'Logging in...';
      status.className = 'status-alert';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        status.className = 'status-alert error';
        status.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Log In';
      } else {
        status.className = 'status-alert success';
        status.textContent = 'Login successful! Redirecting...';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }
    });

    // Handle Signup Submit
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const status = document.getElementById('signupStatus');
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      btn.disabled = true;
      btn.textContent = 'Creating Account...';
      status.className = 'status-alert';

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        status.className = 'status-alert error';
        status.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Create Account';
      } else {
        status.className = 'status-alert success';
        status.textContent = 'Account created successfully! You can now log in.';
        btn.disabled = false;
        btn.textContent = 'Create Account';
        setTimeout(() => {
          switchView('login');
        }, 1500);
      }
    });
  </script>
</body>
</html>
