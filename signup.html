<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign Up — Datahub</title>

<!-- Supabase CDN (UMD Standalone Bundle) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  :root{
    --ink:#171334; --ink-soft:#4b4768; --violet-deep:#211f3d;
    --amber:#FFC107; --cream:#f8f7ff; --line:#e7e5f5;
    --flame-1:#f4841f; --flame-2:#c62b2b; --brand-red:#e0432b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,sans-serif;background:var(--cream);color:var(--ink);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 30px;
      max-width:400px;width:100%;box-shadow:0 24px 50px -30px rgba(23,19,52,.25);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;color:var(--brand-red);margin-bottom:22px;text-decoration:none;}
  h1{font-size:1.4rem;color:var(--violet-deep);margin-bottom:6px;}
  p.sub{color:var(--ink-soft);font-size:.9rem;margin-bottom:24px;}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-soft);margin:14px 0 6px;}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:.95rem;}
  input:focus{outline:none;border-color:var(--flame-1);}
  button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:12px;
      background:linear-gradient(135deg,var(--flame-1),var(--flame-2));color:#fff;font-weight:700;
      font-size:.95rem;cursor:pointer;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:14px;font-size:.85rem;padding:10px 12px;border-radius:8px;display:none;}
  .msg.error{background:#fde8e6;color:#a3251d;display:block;}
  .msg.ok{background:#e8f7ee;color:#1a7a40;display:block;}
  .foot{text-align:center;margin-top:20px;font-size:.85rem;color:var(--ink-soft);}
  .foot a{color:var(--flame-2);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="index.html">
    <svg width="30" height="30" viewBox="0 0 48 48" fill="none">
      <path d="M12 8H24C33.9411 8 40 15.1634 40 24C40 32.8366 33.9411 40 24 40H12V8Z" stroke="url(#signupDGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 18V30" stroke="url(#signupDGrad)" stroke-width="5" stroke-linecap="round"/>
      <defs>
        <linearGradient id="signupDGrad" x1="12" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#f4841f"/>
          <stop offset="1" stop-color="#c62b2b"/>
        </linearGradient>
      </defs>
    </svg>
    Datahub
  </a>
  <h1>Create your account</h1>
  <p class="sub">Start reselling cheap, long lasting data today.</p>

  <form id="signupForm">
    <label for="fullName">Full name</label>
    <input id="fullName" name="fullName" required />

    <label for="email">Email</label>
    <input id="email" type="email" name="email" required />

    <label for="phone">Phone number</label>
    <input id="phone" type="tel" name="phone" placeholder="080..." required />

    <label for="password">Password</label>
    <input id="password" type="password" name="password" minlength="8" required />

    <button type="submit" id="submitBtn">Create Account</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">Already have an account? <a href="login.html">Log in</a></div>
</div>

<script>
  // Direct Inline Credentials
  const SUPABASE_URL = 'https://ykffjitfoswdgnjxlyyc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrZmZqaXRmb3N3ZGduanhseXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTIwOTIsImV4cCI6MjEwNTg4ODA5Mn0.pkfu6MEPIpE62mkHGeDAN1WgkKVxWgzRPloa4A7rlGI';

  let sbClient = null;

  function getClient() {
    if (sbClient) return sbClient;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return sbClient;
    }
    return null;
  }

  const form = document.getElementById('signupForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    const client = getClient();
    if (!client) {
      msg.className = 'msg error';
      msg.textContent = 'Connection error: CDN library is still loading or blocked. Check network and refresh.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    const fullName = form.fullName.value.trim();
    const email = form.email.value.trim();
    const phone = form.phone.value.trim();
    const password = form.password.value;

    try {
      const { data, error } = await client.auth.signUp({
        email: email,
        password: password
      });

      if (error) throw error;

      if (data.user) {
        const { error: profileError } = await client
          .from('profiles')
          .insert([
            { id: data.user.id, full_name: fullName, phone: phone, balance: 0.00 }
          ]);

        if (profileError) console.error("Profile sync error:", profileError);
      }

      msg.className = 'msg ok';
      msg.textContent = 'Account created successfully! Redirecting...';
      setTimeout(() => (window.location.href = 'dashboard.html'), 900);
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err.message || 'Failed to create account.';
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
